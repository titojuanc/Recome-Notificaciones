[project]
name = "recome-notificaciones"
version = "0.1.0"
description = "Worker de notificaciones (push/mail) para Recome"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
